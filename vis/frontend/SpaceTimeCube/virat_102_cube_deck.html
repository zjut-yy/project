<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VIRAT 102 · Space-Time Cube (deck.gl)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
  <link rel="stylesheet" href="./base.css" />
  <link rel="stylesheet" href="./semantic-panels.css" />
  <link rel="stylesheet" href="./event-cards.css" />
  <link rel="stylesheet" href="./xy-panel.css" />
</head>
<body>
  <aside class="panel">
    <h1>Space-Time Cube · VIRAT (deck.gl)</h1>
    <p style="margin:0 0 10px; color:#d6dfeb;">Y 轴为空间纵向，X 轴为空间横向，T 轴为时间（秒）；使用 deck.gl 提升性能。</p>
    <div class="console-card">
      <div class="console-title">主控台</div>
      <div class="row" style="margin-bottom:8px;">
        <button id="btnLoad">加载并绘制</button>
        <button id="btnReset" class="secondary">重置视角</button>
      </div>
      <div class="slider-row" style="margin-top:10px;">
        <span>聚类粒度</span>
        <input id="clusterGranularity" type="range" min="0" max="0.18" value="0.09" step="0.005" />
        <span id="clusterGranularityVal">0.090</span>
      </div>
      <div class="slider-row" style="margin-top:8px;">
        <span>时间窗口</span>
        <input id="timeWindowSec" type="range" min="0" max="120" value="20" step="1" />
        <span id="timeWindowSecVal">20s</span>
      </div>
      <div class="slider-row" style="margin-top:6px;">
        <span>时间权重</span>
        <input id="timeWeight" type="range" min="0" max="0.8" value="0.35" step="0.05" />
        <span id="timeWeightVal">0.35</span>
      </div>
      <div class="row" style="margin-top:8px; align-items:center;">
        <span class="minor-label" style="margin-right:0; min-width:74px;">标签布局</span>
        <select id="semanticLayoutMode" style="flex:1; min-width: 0;">
          <option value="agent_adaptive_color">方案D · 交互前聚类色 / 交互后速度色（无文字）</option>
          <option value="boundary_ring">方案B · 四边外排文本环</option>
          <option value="storyline_global">方案C · STC + 全量故事线</option>
          <option value="inline_stc">兼容 · STC内联标签</option>
        </select>
      </div>
      <div class="row" style="margin-top:8px; align-items:center;">
        <label class="chip">
          <input id="boxSelectEnabled" type="checkbox" />
          <span>启用框选</span>
        </label>
        <button id="btnClearBoxSelect" class="secondary" type="button">清除框选</button>
      </div>
      <div id="boxSelectStatus" class="box-select-status">框选关闭</div>
    </div>

    <div id="trackTextPanel" class="track-text-panel" style="margin-bottom:10px;">
      <div class="track-text-title">交互段（轨迹直显）</div>
      <div class="track-text-empty">等待 Agent 返回文本事件...</div>
    </div>

    <details class="fold-card">
      <summary>场景选择与数据集信息</summary>
      <div class="fold-body">
        <select id="sceneSelect">
          <option value="">加载场景列表...</option>
        </select>
        <div id="sceneInfo" class="scene-info">-</div>
      </div>
      、 

      
    </details>

    <div class="status" id="status" style="margin-top:8px;">等待加载…</div>

    <div style="display:none;">
      <button id="btnClassAll" class="secondary" type="button">全选</button>
      <button id="btnClassNone" class="secondary" type="button">清空</button>
      <div id="classFilters" class="class-filter-grid"></div>
      <div id="statCoverageText" class="coverage-value">-</div>
      <span id="statCoverageBar" class="coverage-fill"></span>
      <div id="classSparkline" class="sparkline-bars"></div>
      <div id="statFrames">-</div>
      <div id="statTracks">-</div>
      <div id="statShown">-</div>
      <div id="statLines">-</div>
      <div id="statSummary">-</div>
      <div id="statLegend">-</div>
      <div id="highlightList">暂无</div>
      <div id="interactionTimeline">暂无</div>
      <input id="modelOnly" type="checkbox" />
      <div id="modelFilters" class="chips"></div>
    </div>
  </aside>
  <main class="center">
    <div class="cube-wrap">
      <div class="topbar">
        <span class="time-label" id="timeLabel">Time -</span>
        <input id="timeSlider" type="range" min="0" max="1" value="0" step="0.1" style="flex:1;" disabled />
        <span class="time-label" id="timeValue">Frame -</span>
      </div>
      <div id="frameDistPanel" class="frame-dist-panel">
        <div class="frame-dist-title">当前帧 XY 平面识别框</div>
        <div id="frameDistSummary" class="frame-dist-summary">等待加载...</div>
        <canvas id="frameXYCanvas" class="frame-xy-canvas"></canvas>
        <div id="frameDistLegend" class="frame-dist-legend">-</div>
      </div>
      <div id="boxSelectOverlay" class="box-select-overlay"></div>
      <div id="semanticOverlay" class="semantic-overlay"></div>
      <div id="deck-canvas" style="width:100%; height:100%;"></div>
    </div>
    <div id="storylineOverviewPanel" class="storyline-overview" hidden>
      <div class="storyline-head">
        <span>全局故事线总览（全轨迹 + 全文本）</span>
        <span id="storylineOverviewMeta" class="storyline-meta">-</span>
      </div>
      <div id="storylineOverviewAxis" class="storyline-axis"></div>
      <div id="storylineOverviewRows" class="storyline-rows"></div>
    </div>
    <div id="multiVideoRail" class="multi-video-rail" hidden>
      <div class="multi-video-head">
        <div class="multi-video-title">多摄像头回放栏（横向滚轮）</div>
        <div class="multi-video-actions">
          <button id="btnRailPlayAll" class="rail-btn" type="button">全部播放</button>
          <button id="btnRailPauseAll" class="rail-btn" type="button">全部暂停</button>
          <button id="btnRailSync" class="rail-btn" type="button">同步到当前帧</button>
        </div>
      </div>
      <div id="multiVideoTrack" class="multi-video-track"></div>
    </div>
  </main>
  <section class="panel right">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
      <h1 style="font-size:16px; margin:0;">对话 · Agent</h1>
      <span class="pill">文本 + 指令</span>
    </div>
    <div class="chat-pane">
      <div id="chatMessages" class="chat-log"></div>
      <textarea id="chatInput" class="chat-input" placeholder="例如：标注最后500秒内进出路口的车辆和行人"></textarea>
      <div class="chat-actions">
        <button id="btnSendAgent" style="flex:1;">发送</button>
        <button id="btnSaveDraft" class="secondary">保存草稿</button>
        <label style="display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); white-space:nowrap;">
          <input id="chkScreenshot" type="checkbox" /> 附带当前帧截图
        </label>
        <span id="agentStatus" class="status" style="margin:0;">Agent 未连接</span>
      </div>
    </div>
  </section>

  <script src="./stc-utils.js"></script>
  <script src="./stc-renderers.js"></script>
  <script src="./stc-app.js"></script>
</body>
</html>
